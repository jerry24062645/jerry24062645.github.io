<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMR Lab Formatter</title>
<style>
body{font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;max-width:1000px;margin:30px auto;padding:20px;background:#f5f7fa;color:#243746}h2{color:#234}textarea{width:100%;height:220px;padding:12px;font-size:14px;box-sizing:border-box;border:1px solid #cfd4dc;border-radius:12px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}button{padding:10px 18px;font-size:15px;cursor:pointer;border:0;border-radius:10px;background:#2f6f62;color:#fff;font-weight:700}button.secondary{background:#fff;color:#2f6f62;border:1px solid #2f6f62}#output{margin-top:20px;padding:15px;min-height:80px;background:white;border:1px solid #ccc;border-radius:12px;white-space:pre-wrap;line-height:1.7}.home-link{display:inline-block;margin-bottom:18px;color:#2f6f62;text-decoration:none;font-weight:700}.note{margin-top:14px;font-size:13px;color:#667085}@media(max-width:600px){body{margin:0 auto;padding:18px}textarea{height:260px}.actions{display:grid;grid-template-columns:1fr 1fr}button{width:100%}}
</style>
</head>
<body>
<a class="home-link" href="index.html#tools">← Back to Health Tools</a>
<h2>Concise EMR Lab Formatter</h2>
<p>Paste raw laboratory data:</p>
<textarea id="input" placeholder="Example:
Free T4 1.22 ng/dL; TSH 4.44 uIU/mL; HbA1c 5.2 %;
Estimated average glucose(eAG) 102; Cholesterol 163 mg/dL;
TG 205 mg/dL; Glucose-AC 90 mg/dL; Creatinine 0.72 mg/dL;
eGFR 104.36; S-GPT 14 U/L; LDL cholesterol 71 mg/dL"></textarea>
<div class="actions"><button onclick="formatLabs()">Format Labs</button><button class="secondary" onclick="copyOutput()">Copy</button></div>
<div id="output"></div>
<div class="note">For documentation assistance only. Verify all values and units against the original laboratory report before entering them into the EMR.</div>
<script>
function getValue(text,patterns){for(const pattern of patterns){const match=text.match(pattern);if(match)return match[1]}return null}
function formatLabs(){const text=document.getElementById("input").value;
const hba1c=getValue(text,[/HbA1c\s*[:=]?\s*([\d.]+)/i]);
const eag=getValue(text,[/Estimated\s+average\s+glucose\s*\(?eAG\)?\s*[:=]?\s*([\d.]+)/i,/\beAG\s*[:=]?\s*([\d.]+)/i]);
const gluAC=getValue(text,[/Glucose-AC\s*[:=]?\s*([\d.]+)/i,/Glu-AC\s*[:=]?\s*([\d.]+)/i]);
const tc=getValue(text,[/(?:Total\s+)?Cholesterol\s*[:=]?\s*([\d.]+)/i,/\bTC\s*[:=]?\s*([\d.]+)/i]);
const tg=getValue(text,[/\bTG\s*[:=]?\s*([\d.]+)/i,/Triglycerides?\s*[:=]?\s*([\d.]+)/i]);
const ldl=getValue(text,[/L\.?D\.?L\.?\s*cholesterol\s*[:=]?\s*([\d.]+)/i,/\bLDL(?:-C)?\s*[:=]?\s*([\d.]+)/i]);
const bun=getValue(text,[/\bBUN\s*[:=]?\s*([\d.]+)/i]);
const cr=getValue(text,[/Creatinine\s*[:=]?\s*([\d.]+)/i,/\bCr\s*[:=]?\s*([\d.]+)/i]);
const egfr=getValue(text,[/eGFR\s*[:=]?\s*([\d.]+)/i]);
const ua=getValue(text,[/Uric\s+Acid\s*\(B\)\s*[:=]?\s*([\d.]+)/i,/Uric\s+Acid\s*[:=]?\s*([\d.]+)/i,/\bUA\s*[:=]?\s*([\d.]+)/i]);
const alt=getValue(text,[/S-GPT\s*[:=]?\s*([\d.]+)/i,/\bALT\s*[:=]?\s*([\d.]+)/i]);
const tsh=getValue(text,[/\bTSH\s*[:=]?\s*([\d.]+)/i]);
const ft4=getValue(text,[/Free\s*T4\s*[:=]?\s*([\d.]+)/i,/\bFT4\s*[:=]?\s*([\d.]+)/i]);
const bnp=getValue(text,[/NT-Pro-BNP\s*[:=]?\s*([\d.]+)/i,/NT-proBNP\s*[:=]?\s*([\d.]+)/i]);
const wbc=getValue(text,[/(?:白血球)?WBC\s*[:=]?\s*([\d.]+)/i]);
const hb=getValue(text,[/(?:血紅素)?HGB\s*[:=]?\s*([\d.]+)/i,/\bHb\s*[:=]?\s*([\d.]+)/i]);
const plt=getValue(text,[/Platelet(?:s)?\s*[:=]?\s*([\d.]+)/i,/\bPlt\s*[:=]?\s*([\d.]+)/i]);
let lines=[];let diabetes=[];if(hba1c){let value=`HbA1c ${hba1c}%`;if(eag)value+=` (eAG ${eag} mg/dL)`;diabetes.push(value)}if(gluAC)diabetes.push(`Glu-AC ${gluAC} mg/dL`);if(diabetes.length)lines.push("• "+diabetes.join(", "));
if(tc||tg||ldl){if(tc&&tg&&ldl)lines.push(`• TC/TG/LDL ${tc}/${tg}/${ldl} mg/dL`);else{let values=[];if(tc)values.push(`TC ${tc} mg/dL`);if(tg)values.push(`TG ${tg} mg/dL`);if(ldl)values.push(`LDL ${ldl} mg/dL`);lines.push("• "+values.join(", "))}}
let renal=[];if(bun&&cr)renal.push(`BUN/Cr ${bun}/${cr} mg/dL`);else{if(bun)renal.push(`BUN ${bun} mg/dL`);if(cr)renal.push(`Cr ${cr} mg/dL`)}if(egfr)renal.push(`eGFR ${egfr}`);if(renal.length)lines.push("• "+renal.join(", "));
let liver=[];if(alt)liver.push(`ALT ${alt} U/L`);if(ua)liver.push(`UA ${ua} mg/dL`);if(liver.length)lines.push("• "+liver.join(", "));
let thyroid=[];if(tsh)thyroid.push(`TSH ${tsh} μIU/mL`);if(ft4)thyroid.push(`FT4 ${ft4} ng/dL`);if(thyroid.length)lines.push("• "+thyroid.join(", "));
if(bnp)lines.push(`• NT-proBNP ${bnp} pg/mL`);
let cbc=[];if(wbc)cbc.push(`WBC ${wbc} ×10³/μL`);if(hb)cbc.push(`Hb ${hb} g/dL`);if(plt)cbc.push(`Plt ${plt} ×10³/μL`);if(cbc.length)lines.push("• "+cbc.join(", "));
document.getElementById("output").textContent=lines.length?lines.join("\n"):"No recognized laboratory values found."}
async function copyOutput(){const output=document.getElementById("output").textContent;if(!output)return;try{await navigator.clipboard.writeText(output)}catch(err){const range=document.createRange();range.selectNodeContents(document.getElementById("output"));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);document.execCommand("copy");selection.removeAllRanges()}}
</script>
</body></html>
